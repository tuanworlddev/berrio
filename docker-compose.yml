services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: berrio
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
